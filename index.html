<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI Report | ลานจอด ABC</title>
  <meta name="description" content="Web app สำหรับจัดทำรายงาน KPI ลานจอด ABC บน Netlify และ Firebase">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    window.__FIREBASE_CONFIG__ = {
      apiKey: "AIzaSyDzI-JOygZAQwZNiBbIlY9OSrXMq1QRdSQ",
      authDomain: "kpi-abc-yard.firebaseapp.com",
      projectId: "kpi-abc-yard",
      storageBucket: "kpi-abc-yard.firebasestorage.app",
      messagingSenderId: "353382645394",
      appId: "1:353382645394:web:2674ac1b5d1a2e5898304b",
      measurementId: "G-EZG1JQHH14"
    };
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>

  <main class="shell">
    <section class="hero">
      <div>
        <p class="eyebrow">Netlify + Firebase</p>
        <h1>KPI Report ลานจอด ABC</h1>
        <p class="hero-copy">
          กรอกข้อมูล KPI รายวันหรือรายเดือน เก็บลง Firestore และสรุปผลบนแดชบอร์ดเดียว
        </p>
      </div>
      <div class="hero-actions">
        <button id="btn-login" class="btn btn-primary">Sign in with Google</button>
        <button id="btn-logout" class="btn btn-secondary hidden">Sign out</button>
      </div>
    </section>

    <section class="toolbar card">
      <div class="toolbar-group">
        <label for="report-period">รอบรายงาน</label>
        <input id="report-period" type="month">
      </div>
      <div class="toolbar-group">
        <label for="report-site">สถานที่</label>
        <input id="report-site" type="text" value="ลานจอด ABC">
      </div>
      <div class="toolbar-group">
        <label for="report-owner">ผู้จัดทำ</label>
        <input id="report-owner" type="text" placeholder="ชื่อผู้บันทึก">
      </div>
      <div class="toolbar-group toolbar-summary">
        <span id="auth-status">ยังไม่ได้เข้าสู่ระบบ</span>
        <span id="save-status">ยังไม่บันทึก</span>
      </div>
    </section>

    <section class="layout">
      <section class="card form-card">
        <div class="section-head">
          <div>
            <p class="section-kicker">Data Entry</p>
            <h2>กรอกตัวเลข KPI</h2>
          </div>
          <button id="btn-new-report" class="btn btn-ghost">สร้างชุดข้อมูลใหม่</button>
        </div>
        <form id="kpi-form" class="kpi-form"></form>
        <div class="form-actions">
          <button type="button" id="btn-reset" class="btn btn-secondary">ล้างค่าในฟอร์ม</button>
          <button type="submit" form="kpi-form" class="btn btn-primary">บันทึกรายงาน</button>
        </div>
      </section>

      <section class="stack">
        <section class="card">
          <div class="section-head compact">
            <div>
              <p class="section-kicker">Summary</p>
              <h2>สรุปภาพรวม</h2>
            </div>
          </div>
          <div id="summary-grid" class="summary-grid"></div>
        </section>

        <section class="card">
          <div class="section-head compact">
            <div>
              <p class="section-kicker">History</p>
              <h2>รายงานที่บันทึกไว้</h2>
            </div>
          </div>
          <div id="reports-list" class="reports-list"></div>
        </section>
      </section>
    </section>
  </main>
</body>
</html>
