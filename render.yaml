services:
  - type: web
    name: facebook-auto-post
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: FB_PAGE_ID
        sync: false
      - key: FB_TOKEN
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: SUPABASE_URL
        value: https://erbfwmtdvdtwxrvnpeej.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
